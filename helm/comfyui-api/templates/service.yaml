apiVersion: v1
kind: Service
metadata:
  name: {{ include "comfyui-api.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "comfyui-api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "comfyui-api.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
